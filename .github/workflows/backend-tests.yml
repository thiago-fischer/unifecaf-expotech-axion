name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      AXION_DATABASE_URL: postgresql+psycopg://axion:axion_test@127.0.0.1:5432/postgres
      AXION_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://axion:axion_test@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axion
          POSTGRES_USER: axion
          POSTGRES_PASSWORD: axion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion -d axion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            optimizer/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Show tool versions
        run: |
          uv --version
          uv run --locked --no-sync python --version

      - name: Run backend tests
        run: uv run --locked pytest -q

      - name: Run optimizer tests
        run: uv run --locked pytest -q ../optimizer/tests

      - name: Check lint and formatting
        run: |
          uv run --locked ruff check . ../optimizer
          uv run --locked ruff format --check . ../optimizer

      - name: Verify independent optimizer installation
        working-directory: optimizer
        run: |
          uv sync --locked --python 3.12
          uv run --locked pytest -q

      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain)"

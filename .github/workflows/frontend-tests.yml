name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  tests:
    name: React and real API (Node 24)
    runs-on: ubuntu-latest
    env:
      AXION_DATABASE_URL: postgresql+psycopg://axion:axion_test@127.0.0.1:5432/postgres
      AXION_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://axion:axion_test@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axion
          POSTGRES_USER: axion
          POSTGRES_PASSWORD: axion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion -d axion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check types and formatting
        run: |
          npm run check
          npm run format:check
      - name: Run component and HTTP tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.7'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --group dev
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate flow with real API
        run: npm run test:e2e
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain)"

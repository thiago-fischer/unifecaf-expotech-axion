name: axion

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axion}
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axion_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - axion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - axion

  migrations:
    image: axion-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      AXION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axion}:${POSTGRES_PASSWORD:-axion_local}@database:5432/${POSTGRES_DB:-axion}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - axion

  backend:
    image: axion-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AXION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axion}:${POSTGRES_PASSWORD:-axion_local}@database:5432/${POSTGRES_DB:-axion}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - axion

  frontend:
    image: axion-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - axion

volumes:
  axion_postgres_data:

networks:
  axion:
    name: axion


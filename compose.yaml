name: axion

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axion}
      POSTGRES_USER: ${POSTGRES_USER:-axion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axion_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - axion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - axion

  migrations:
    image: axion-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      AXION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axion}:${POSTGRES_PASSWORD:-axion_local}@database:5432/${POSTGRES_DB:-axion}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - axion

  grafana-db-init:
    image: axion-backend
    command: ["python", "scripts/prepare_grafana_reader.py"]
    environment:
      AXION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axion}:${POSTGRES_PASSWORD:-axion_local}@database:5432/${POSTGRES_DB:-axion}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader_local}
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - axion

  backend:
    image: axion-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AXION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axion}:${POSTGRES_PASSWORD:-axion_local}@database:5432/${POSTGRES_DB:-axion}
      AXION_CONTROLLER_URL: http://controller:8001
      AXION_CONTROLLER_EVENTS_TOKEN: ${AXION_CONTROLLER_EVENTS_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - axion

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    environment:
      AXION_CONTROLLER_INITIAL_PIECES: ${AXION_CONTROLLER_INITIAL_PIECES:-10}
      AXION_CONTROLLER_EVENTS_URL: http://backend:8000/controller/events
      AXION_CONTROLLER_EVENTS_TOKEN: ${AXION_CONTROLLER_EVENTS_TOKEN:-}
    ports:
      - "127.0.0.1:${CONTROLLER_PORT:-8001}:8001"
    networks:
      - axion

  frontend:
    image: axion-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - axion

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_admin_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      POSTGRES_DB: ${POSTGRES_DB:-axion}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader_local}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - axion_grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null http://127.0.0.1:3000/api/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
    networks:
      - axion

volumes:
  axion_postgres_data:
  axion_grafana_data:

networks:
  axion:
    name: axion


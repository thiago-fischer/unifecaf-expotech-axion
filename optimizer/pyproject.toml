[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "axion-optimizer"
version = "0.1.0"
description = "Planejamento job shop do Axion com AG e CP-SAT"
requires-python = ">=3.12,<3.15"
dependencies = ["ortools==9.15.6755"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
